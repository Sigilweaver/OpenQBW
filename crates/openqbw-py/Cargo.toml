[package]
name = "openqbw-py"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords = ["quickbooks", "qbw", "python", "accounting"]
categories = ["api-bindings"]
description = "Python bindings for openqbw"
# No workspace lints inheritance: pyo3 macros generate unsafe code,
# which conflicts with workspace `unsafe_code = forbid`.

[lib]
name = "openqbw"
crate-type = ["cdylib"]

[dependencies]
openqbw_rs = { package = "openqbw", path = "../openqbw", version = "0.1.0" }
opensqlany = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
