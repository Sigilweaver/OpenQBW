name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout OpenQBW
        uses: actions/checkout@v4
        with:
          path: OpenQBW

      - name: Checkout OpenSQLAnywhere (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: Sigilweaver/OpenSQLAnywhere
          path: OpenSQLAnywhere

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: OpenQBW

      - name: clippy
        working-directory: OpenQBW
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        working-directory: OpenQBW
        run: cargo test --workspace --all-targets
