name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout OpenQBW
        uses: actions/checkout@v7
        with:
          path: OpenQBW

      - name: Checkout OpenSQLAnywhere (sibling path dep)
        uses: actions/checkout@v7
        with:
          repository: Sigilweaver/OpenSQLAnywhere
          path: OpenSQLAnywhere

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: OpenQBW

      - name: clippy
        working-directory: OpenQBW
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        working-directory: OpenQBW
        run: cargo test --workspace --all-targets

  msrv:
    name: MSRV check (1.95)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenQBW
        uses: actions/checkout@v7
        with:
          path: OpenQBW

      - name: Checkout OpenSQLAnywhere (sibling path dep)
        uses: actions/checkout@v7
        with:
          repository: Sigilweaver/OpenSQLAnywhere
          path: OpenSQLAnywhere

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: OpenQBW

      - name: cargo check (MSRV)
        working-directory: OpenQBW
        run: cargo check --workspace --all-targets

  python-wheel:
    name: python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout OpenQBW
        uses: actions/checkout@v7
        with:
          path: OpenQBW

      - name: Checkout OpenSQLAnywhere (sibling path dep)
        uses: actions/checkout@v7
        with:
          repository: Sigilweaver/OpenSQLAnywhere
          path: OpenSQLAnywhere

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: OpenQBW

      - name: Build wheel
        working-directory: OpenQBW/crates/openqbw-py
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --strip

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: openqbw-wheel-${{ matrix.os }}
          path: OpenQBW/target/wheels/*.whl
          if-no-files-found: error

  docs:
    name: Docs (Docusaurus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: docs
        run: bun run build:cloudflare
