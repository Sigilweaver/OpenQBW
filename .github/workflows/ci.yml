name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-targets

  msrv:
    name: MSRV check (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets

  python-wheel:
    name: python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        working-directory: crates/openqbw-py
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --strip

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: openqbw-wheel-${{ matrix.os }}
          path: target/wheels/*.whl
          if-no-files-found: error

  docs-validation:
    name: Shared docs validation
    permissions:
      contents: read
    uses: Sigilweaver/docs-kit/.github/workflows/site.yml@06708bed683383e39805ba1f6c505ba9e1e08f15
  docs:
    name: Docs (Docusaurus)
    needs: docs-validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      DOCS_RESULT: ${{ needs.docs-validation.result }}
    steps:
      - run: test "$DOCS_RESULT" = success
