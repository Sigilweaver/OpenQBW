name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # opensqlany must already be published at the matching version
      # on crates.io. Path dep is stripped by `cargo publish` and the
      # version constraint in Cargo.toml is what cargo will resolve.
      - name: Publish openqbw
        run: cargo publish -p openqbw --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish openqbw-cli
        run: cargo publish -p openqbw-cli --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    name: publish wheel to PyPI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout OpenQBW
        uses: actions/checkout@v4
        with:
          path: OpenQBW

      - name: Checkout OpenSQLAnywhere (sibling path dep for build)
        uses: actions/checkout@v4
        with:
          repository: Sigilweaver/OpenSQLAnywhere
          path: OpenSQLAnywhere

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: OpenQBW

      - name: Build wheel
        working-directory: OpenQBW/crates/openqbw-py
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --strip --out dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: openqbw-wheel-${{ matrix.os }}
          path: OpenQBW/crates/openqbw-py/dist/*.whl
          if-no-files-found: error

  publish-pypi-sdist:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-pypi
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openqbw-wheel-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
