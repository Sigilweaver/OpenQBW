name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: tag matches versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # A release is a v<version> tag. The tag must equal the workspace
      # version in Cargo.toml and the version in the Python package's
      # pyproject.toml, and the versions the crates require of each other,
      # or nothing is published.
      - name: Check the tag against the package versions
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::a release runs on a v<version> tag; this run is on $GITHUB_REF"
            exit 1
          fi
          python3 - <<'PY'
          import os, sys, tomllib

          def load(path):
              with open(path, "rb") as f:
                  return tomllib.load(f)

          tag = os.environ["GITHUB_REF_NAME"]
          root = load("Cargo.toml")
          cargo = root["workspace"]["package"]["version"]
          found = {
              "workspace version (Cargo.toml)": cargo,
              "openqbw requirement (Cargo.toml workspace.dependencies)":
                  root["workspace"]["dependencies"]["openqbw"]["version"],
              "openqbw requirement (crates/openqbw-py/Cargo.toml)":
                  load("crates/openqbw-py/Cargo.toml")["dependencies"]["openqbw_rs"]["version"],
              "pyproject version (crates/openqbw-py/pyproject.toml)":
                  load("crates/openqbw-py/pyproject.toml")["project"]["version"],
          }
          bad = False
          if tag != f"v{cargo}":
              print(f"::error::tag {tag} is not v{cargo}, the workspace version")
              bad = True
          for name, value in found.items():
              if value != cargo:
                  print(f"::error::{name} is {value}, expected {cargo}")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

  publish-crates:
    name: publish to crates.io
    needs: check-version
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # opensqlany comes from crates.io (the version in Cargo.toml). openqbw-cli
      # depends on openqbw by its path and version; `cargo publish` drops the
      # path and resolves the version from the index, so openqbw is published
      # first and the index is given time to list it before openqbw-cli.
      - name: Publish openqbw
        run: cargo publish -p openqbw --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish openqbw-cli
        run: cargo publish -p openqbw-cli --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    name: publish wheel to PyPI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: publish-crates
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        working-directory: crates/openqbw-py
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --strip --out dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: openqbw-wheel-${{ matrix.os }}
          path: crates/openqbw-py/dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: build sdist
    runs-on: ubuntu-latest
    needs: publish-crates
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist
        working-directory: crates/openqbw-py
        run: |
          python -m pip install --upgrade pip maturin
          maturin sdist --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: openqbw-sdist
          path: crates/openqbw-py/dist/*.tar.gz
          if-no-files-found: error

  publish-pypi-sdist:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [publish-pypi, build-sdist]
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: openqbw-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
