[workspace]
resolver = "3"
members = ["crates/openqbw", "crates/openqbw-cli", "crates/openqbw-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Nathan Riley"]

[workspace.dependencies]
openqbw = { path = "crates/openqbw", version = "0.1.0" }
opensqlany = { path = "../OpenSQLAnywhere/crates/opensqlany", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
