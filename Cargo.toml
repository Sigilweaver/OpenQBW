[workspace]
resolver = "3"
members = ["crates/openqbw", "crates/openqbw-cli", "crates/openqbw-py"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenQBW"
homepage = "https://sigilweaver.app/openqbw/"
documentation = "https://sigilweaver.app/openqbw/docs/"
readme = "README.md"
authors = ["Nathan Riley"]
keywords = ["quickbooks", "qbw", "accounting", "parser", "intuit"]
categories = ["parser-implementations", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
openqbw = { path = "crates/openqbw", version = "0.1.6" }
# The pinned rev below carries the opensqlany 0.3 API but its manifest still
# says 0.2.0, so the requirement names 0.2.0 until 0.3.0 is on crates.io.
opensqlany = "0.2.0"
# Local cross-repo dev: add a `.cargo/config.toml` with
#   [patch.crates-io]
#   opensqlany = { path = "../OpenSQLAnywhere/crates/opensqlany" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"

# Temporary: opensqlany 0.3.0 is not on crates.io yet. Remove this patch and
# set the requirement above to "0.3.0" once it is published.
[patch.crates-io]
opensqlany = { git = "https://github.com/Sigilweaver/OpenSQLAnywhere", rev = "0fae7d9f320d4fdb62f70571d399989f57e1da48" }
